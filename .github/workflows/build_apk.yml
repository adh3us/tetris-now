name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # jni/jni_flutter (dependencia transitiva de google_sign_in) necesita
      # CMake para compilar en el runner; no viene preinstalado.
      - name: Install CMake
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-now-apk
          path: build/app/outputs/flutter-apk/*.apk

      # Se borra la release anterior (si existe) antes de recrearla: GitHub
      # no actualiza la fecha de publicación cuando solo se reemplaza el
      # archivo adjunto, así que sin este paso la app siempre muestra la
      # fecha de la primera vez que se creó "latest-apk".
      - name: Delete previous latest-apk release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-apk --repo ${{ github.repository }} --yes --cleanup-tag

      # Release fija (tag 'latest-apk') que se recrea en cada build verde,
      # para tener siempre un link de descarga estable, sin login, y con la
      # fecha de publicación al día.
      - name: Publish APK to latest-apk release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Última APK (build automática)"
          body: |
            APK de debug compilado automáticamente desde `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Esta release se borra y se vuelve a crear en cada build verde, así que la fecha de "lanzó esto..." de arriba siempre es la del último build, no una vieja.
          prerelease: true
          files: build/app/outputs/flutter-apk/*.apk
