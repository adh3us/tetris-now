name: Build Tetris Now APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install CMake 3.22.1 (requerido por jni/jni_flutter, dependencia nativa de google_sign_in)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmake;3.22.1"

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test test/tetris_engine_test.dart

      - name: Build Debug APK
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tetris-Now-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

      # Publica el APK como GitHub Release en vez de solo Artifact:
      # el link de descarga queda directo (sin login ni zip), y es
      # estable — cada push a main que compila bien pisa la misma
      # Release "latest-apk" con el APK mas nuevo.
      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "Tetris Now - último build (${{ github.sha }})"
          prerelease: true
          body: |
            APK de debug compilado automáticamente desde `main` (commit ${{ github.sha }}).
            Este release se sobreescribe en cada build verde — siempre apunta al último código.
          files: build/app/outputs/flutter-apk/app-debug.apk
